; Default settings for the Traffic-Based Route Guidance System (TBRGS).
; The GUI reads these at start-up, and its "Save as defaults" buttons write
; new values back to this file. Paths are relative to this folder.
; Comments must be on their own line (start the line with ; or #).

[data]
scats_file = data/Scats Data October 2006.xls
site_listing_file = data/SCATSSiteListingSpreadsheet_VicRoads.xls
manual_links_file = data/manual_links.csv
cache_dir = data/cache
; Chronological split. Training targets are 1-21 Oct 2006 (three full weeks),
; validation targets 22-24 Oct, and test targets 25-31 Oct (one full week).
train_end = 2006-10-21
validation_end = 2006-10-24

[features]
; Number of past 15-minute intervals each model sees (12 = the last 3 hours).
lags = 12

[lstm]
units = 64
layers = 2
dropout = 0.2
epochs = 100
batch_size = 256
learning_rate = 0.001
patience = 6
seed = 42

[gru]
units = 64
layers = 2
dropout = 0.2
epochs = 100
batch_size = 256
learning_rate = 0.001
patience = 6
seed = 42

[xgboost]
n_estimators = 2000
max_depth = 8
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.8
min_child_weight = 5
early_stopping_rounds = 50
seed = 42

[travel_time]
speed_limit_kmh = 60
; Turning point of the flow-speed parabola (Traffic Flow to Travel Time Conversion v1.0).
capacity_flow_vph = 1500
capacity_speed_kmh = 32
intersection_delay_s = 30
; Which detector gives the flow for a link A -> B:
;   destination = the detector at site B on the approach from A (the brief: "volume at SCATS site B")
;   origin      = the detector at site A on the approach that leads on towards B (the conversion note)
flow_site = destination

[routing]
k = 5
; One of AS, CUS1, BFS, DFS, GBFS, CUS2 (the Part A methods).
method = AS

[gui]
model = lstm
date = 2006-10-25
time = 08:00
origin = 2000
destination = 3002

[map]
; Shift added to the SCATS coordinates before drawing them on OpenStreetMap
; (estimated by "python research.py coordinates"; degrees).
lat_offset = 0.00091
lon_offset = 0.00107

[paths]
model_dir = saved_models
results_dir = results
